version: "3.5"

services:
  # php
  php:
    build:
      context: .
      target: php
    entrypoint: "/bin/sh /scripts/entrypoint.sh"
    working_dir: "/application"
    depends_on:
      - mysql
    volumes:
      - .:/application
      - ./infrastructure/php/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
      - ./infrastructure/php/scripts:/scripts
      #- ./infrastructure/php/configs/messenger-worker.conf:/etc/supervisor/conf.d/messenger-worker.conf
      - ./.env:/application/.env
    networks:
      - db-php
      - frontend-network

  # nginx
  nginx:
    image: nginx:1.27.3
    working_dir: /application
    ports:
      - "80:80"
    volumes:
      - .:/application
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - frontend-network

  # mysql
  mysql:
    image: mysql:8.0.31
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - db-php

networks:
  db-php:
    driver: bridge
  frontend-network:
    driver: bridge

volumes:
  dbdata:
